name: Docker image

# Publishes the app image to ghcr.io/haitrr/lwt when a version is cut: pushing a vX.Y.Z tag (or publishing a GitHub
# release, which creates one) builds it as X.Y.Z, X.Y, X (from 1.0.0 on) and latest. A pre-release tag such as
# v1.2.0-rc.1 gets only its own version tag. Commits to master publish nothing.
#
# Pull requests that touch the image's build inputs build it without pushing, so a broken Dockerfile shows up before
# the next release. Running the workflow by hand on a tag rebuilds and republishes that version.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.ts
      - scripts/**
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        if: env.PUBLISH == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Bump it with npm version first."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto adds latest to every semver tag that is not a pre-release.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
