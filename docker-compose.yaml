# The app plus its Postgres database. The schema is created when the app starts.
# To bring over the data of the old MySQL database, see "Moving from MySQL" in README.md.
services:
  web:
    build: .
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://lwt:${POSTGRES_PASSWORD}@postgres:5432/lwt
      LWT_JWT_SECRET: ${LWT_JWT_SECRET}
      LWT_DICTIONARY_API_ROOT: ${LWT_DICTIONARY_API_ROOT:-}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: lwt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lwt
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'lwt']
      interval: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
  postgres-backup:
    # Hourly pg_dump, encrypted with age before it reaches the volume. See "Backups" in README.md.
    build: docker/backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: lwt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lwt
      # The public half of the backup key; the container refuses to start without it.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_KEEP_HOURS: 48
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - postgres-backups:/backups
volumes:
  postgres-data:
  postgres-backups:
    driver: local
    driver_opts:
      type: nfs
      o: 'addr=ugnas.lc,rw,noatime,nolock,intr,tcp,actimeo=1800,nfsvers=3'
      device: ':/volume2/backups/lwt'
